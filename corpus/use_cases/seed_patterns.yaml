# Curated use cases; summaries in our own words.
# verified means the cited source was checked, not independent validation of vendor claims.
# Templates are implementation examples, not proven customer deployments.
# pattern, ai_does, needs, sme_fit and pilot_metrics are editorial SME adaptations.
# typical_effect contains publisher-reported results only; null means no quantified result captured.

- id: email-triage-and-routing
  title: Shared inbox classification and routing
  source_name: n8n
  source_url: https://n8n.io/workflows/9157-ai-powered-email-triage-and-auto-response-system-with-openai-agents-and-gmail/
  source_type: workflow template
  verified: true
  verified_on: '2026-11-12'
  source_summary: Template classifies incoming mail and routes it to specialist agents.
  pattern: Messages wait in a shared inbox for manual sorting.
  ai_does: Classifies messages and drafts replies; staff approve outbound messages.
  process_types:
  - customer service
  - back office
  needs:
  - shared inbox
  - category owners
  - review queue
  sme_fit: High with stable categories.
  money_lever: unit_cost
  typical_effect: null
  approach: quick win
  pilot_metrics:
  - Minutes per message
  - routing accuracy
  human_role: A named process owner validates outputs and approves consequential actions.
  additional_sources:
  - name: 'OpenAI / ChatGPT: Get your email to inbox zero'
    url: https://learn.chatgpt.com/use-cases/manage-your-inbox
    source_type: workflow guide
    summary: Guide prioritizes messages and drafts replies; sending and cleanup actions require approval.
    verified_on: '2026-11-12'
  task_scope: Organizes incoming mail and drafts responses; policy-grounded support answers remain customer-support-assistant.
